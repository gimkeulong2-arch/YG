<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#07152b"
  >

  <title>KBO 순위 | 윤강 자이언츠</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;

      background: #f3f5f8;
      color: #111827;
    }

    .top {
      padding: 18px 17px 28px;

      background:
        linear-gradient(
          145deg,
          #07152b,
          #102b55
        );

      color: white;
    }

    .top-inner {
      max-width: 760px;
      margin: 0 auto;
    }

    .nav {
      display: flex;
      align-items: center;

      margin-bottom: 30px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 40px;
      height: 40px;

      border-radius: 13px;

      background:
        rgba(
          255,
          255,
          255,
          0.11
        );

      color: white;

      font-size: 25px;
      font-weight: 700;

      text-decoration: none;
    }

    .title-small {
      margin-bottom: 7px;

      color: #9fb3d2;

      font-size: 12px;
      font-weight: 800;
    }

    h1 {
      margin: 0;

      font-size: 31px;

      letter-spacing: -0.045em;
    }

    .description {
      margin: 10px 0 0;

      color: #b7c4d8;

      font-size: 13px;
      line-height: 1.6;
    }

    main {
      width: 100%;
      max-width: 760px;

      margin: 0 auto;

      padding: 21px 13px 60px;
    }

    .lotte-summary {
      display: none;

      margin-bottom: 20px;

      padding: 18px;

      border-radius: 19px;

      background:
        linear-gradient(
          135deg,
          #e51b35,
          #b5122b
        );

      color: white;

      box-shadow:
        0 6px 20px
        rgba(
          180,
          18,
          43,
          0.16
        );
    }

    .lotte-label {
      margin-bottom: 8px;

      color:
        rgba(
          255,
          255,
          255,
          0.75
        );

      font-size: 11px;
      font-weight: 800;
    }

    .lotte-main {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;

      gap: 15px;
    }

    .lotte-rank {
      font-size: 29px;
      font-weight: 900;

      letter-spacing: -0.04em;
    }

    .lotte-record {
      color:
        rgba(
          255,
          255,
          255,
          0.88
        );

      font-size: 12px;
      font-weight: 700;

      text-align: right;
    }

    .info {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin: 0 4px 11px;
    }

    .info strong {
      font-size: 16px;
    }

    .info span {
      color: #8a94a3;

      font-size: 11px;
    }

    .table-card {
      overflow: hidden;

      background: white;

      border: 1px solid #e5e9ef;
      border-radius: 18px;

      box-shadow:
        0 5px 18px
        rgba(
          25,
          35,
          55,
          0.04
        );
    }

    .table-scroll {
      overflow-x: auto;

      -webkit-overflow-scrolling:
        touch;
    }

    table {
      width: 100%;
      min-width: 650px;

      border-collapse: collapse;
    }

    th {
      padding: 13px 8px;

      background: #f8f9fb;

      color: #7b8493;

      border-bottom: 1px solid #e9ecf0;

      font-size: 11px;
      font-weight: 800;

      text-align: center;

      white-space: nowrap;
    }

    td {
      padding: 15px 8px;

      border-bottom: 1px solid #edf0f3;

      color: #4b5563;

      font-size: 12px;

      text-align: center;

      white-space: nowrap;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr {
      transition:
        background 0.15s;
    }

    .rank {
      width: 44px;

      color: #111827;

      font-size: 14px;
      font-weight: 900;
    }

    .team {
      min-width: 90px;

      color: #111827;

      font-size: 13px;
      font-weight: 800;

      text-align: left;
    }

    .lotte {
      background: #fff4f6;
    }

    .lotte .rank,
    .lotte .team {
      color: #d71935;
    }

    .lotte .team::after {
      content: "LOTTE";

      display: inline-block;

      margin-left: 6px;
      padding: 3px 5px;

      border-radius: 5px;

      background: #e51b35;
      color: white;

      font-size: 7px;
      font-weight: 900;

      vertical-align: 2px;
    }

    .loading,
    .error {
      padding: 48px 20px;

      color: #8a94a3;

      text-align: center;

      font-size: 13px;
      line-height: 1.6;
    }

    .loading-icon,
    .error-icon {
      margin-bottom: 10px;

      font-size: 28px;
    }

    .retry {
      display: inline-block;

      margin-top: 15px;
      padding: 9px 14px;

      border: 0;
      border-radius: 10px;

      background: #07152b;
      color: white;

      font-size: 12px;
      font-weight: 800;

      cursor: pointer;
    }

    .notice {
      margin: 12px 4px 0;

      color: #9aa2ae;

      font-size: 10px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 22px;

      color: #a0a7b2;

      font-size: 11px;

      text-align: center;
    }

    @media (
      max-width: 500px
    ) {
      .top {
        padding-bottom: 25px;
      }

      h1 {
        font-size: 29px;
      }

      .lotte-rank {
        font-size: 27px;
      }
    }
  </style>
</head>


<body>

  <header class="top">

    <div class="top-inner">

      <div class="nav">

        <a
          href="/"
          class="back"
          aria-label="메인으로 돌아가기"
        >
          ‹
        </a>

      </div>


      <div class="title-small">
        YUNGANG GIANTS
      </div>


      <h1>
        KBO 순위
      </h1>


      <p class="description">
        KBO 리그의 현재 팀 순위를
        확인합니다.
      </p>

    </div>

  </header>


  <main>

    <section
      class="lotte-summary"
      id="lotteSummary"
    >

      <div class="lotte-label">
        LOTTE GIANTS
      </div>


      <div class="lotte-main">

        <div
          class="lotte-rank"
          id="lotteRank"
        >
          -
        </div>


        <div
          class="lotte-record"
          id="lotteRecord"
        >
          -
        </div>

      </div>

    </section>


    <div class="info">

      <strong>
        팀 순위
      </strong>

      <span id="updateText">
        불러오는 중
      </span>

    </div>


    <div class="table-card">

      <div
        class="loading"
        id="standings"
      >

        <div class="loading-icon">
          🏆
        </div>

        KBO 순위를 불러오는 중입니다.

      </div>

    </div>


    <div class="notice">
      순위 데이터는 KBO 데이터를 기반으로 표시됩니다.
      표는 좌우로 스크롤할 수 있습니다.
    </div>


    <div class="footer">
      윤강 자이언츠
    </div>

  </main>


  <script>

    function escapeHtml(value) {
      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );
    }


    function displayValue(value) {
      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return "-";
      }

      return value;
    }


    function renderLotteSummary(
      lotte
    ) {
      if (!lotte) {
        return;
      }


      const box =
        document.getElementById(
          "lotteSummary"
        );


      document
        .getElementById(
          "lotteRank"
        )
        .textContent =
          lotte.rank +
          "위";


      document
        .getElementById(
          "lotteRecord"
        )
        .textContent =
          displayValue(
            lotte.wins
          ) +
          "승 " +
          displayValue(
            lotte.losses
          ) +
          "패 " +
          displayValue(
            lotte.draws
          ) +
          "무 · 승률 " +
          displayValue(
            lotte.winRate
          );


      box.style.display =
        "block";
    }


    function createRow(team) {
      const isLotte =
        String(
          team.team || ""
        ).includes(
          "롯데"
        );


      return `
        <tr
          class="${
            isLotte
              ? "lotte"
              : ""
          }"
        >

          <td class="rank">
            ${escapeHtml(
              displayValue(
                team.rank
              )
            )}
          </td>

          <td class="team">
            ${escapeHtml(
              displayValue(
                team.team
              )
            )}
          </td>

          <td>
            ${escapeHtml(
              displayValue(
                team.games
              )
            )}
          </td>

          <td>
            ${escapeHtml(
              displayValue(
                team.wins
              )
            )}
          </td>

          <td>
            ${escapeHtml(
              displayValue(
                team.losses
              )
            )}
          </td>

          <td>
            ${escapeHtml(
              displayValue(
                team.draws
              )
            )}
          </td>

          <td>
            ${escapeHtml(
              displayValue(
                team.winRate
              )
            )}
          </td>

          <td>
            ${escapeHtml(
              displayValue(
                team.gamesBehind
              )
            )}
          </td>

          <td>
            ${escapeHtml(
              displayValue(
                team.last10
              )
            )}
          </td>

          <td>
            ${escapeHtml(
              displayValue(
                team.streak
              )
            )}
          </td>

        </tr>
      `;
    }


    function renderStandings(
      standings
    ) {
      const box =
        document.getElementById(
          "standings"
        );


      const rows =
        standings
          .map(
            createRow
          )
          .join("");


      box.className =
        "table-scroll";


      box.innerHTML = `
        <table>

          <thead>

            <tr>

              <th>
                순위
              </th>

              <th>
                팀
              </th>

              <th>
                경기
              </th>

              <th>
                승
              </th>

              <th>
                패
              </th>

              <th>
                무
              </th>

              <th>
                승률
              </th>

              <th>
                게임차
              </th>

              <th>
                최근10
              </th>

              <th>
                연속
              </th>

            </tr>

          </thead>


          <tbody>
            ${rows}
          </tbody>

        </table>
      `;
    }


    function renderError(
      message
    ) {
      const box =
        document.getElementById(
          "standings"
        );


      box.className =
        "error";


      box.innerHTML = `
        <div class="error-icon">
          ⚠️
        </div>

        순위 정보를 불러오지 못했습니다.

        <br>

        <small>
          ${escapeHtml(
            message ||
            ""
          )}
        </small>

        <br>

        <button
          class="retry"
          onclick="loadStandings()"
        >
          다시 시도
        </button>
      `;


      document
        .getElementById(
          "updateText"
        )
        .textContent =
          "불러오기 실패";
    }


    function setUpdateText(
      year
    ) {
      const now =
        new Date();


      const time =
        new Intl.DateTimeFormat(
          "ko-KR",
          {
            timeZone:
              "Asia/Seoul",

            month:
              "numeric",

            day:
              "numeric",

            hour:
              "2-digit",

            minute:
              "2-digit"
          }
        ).format(now);


      document
        .getElementById(
          "updateText"
        )
        .textContent =
          (
            year
              ? year +
                " · "
              : ""
          ) +
          time +
          " 기준";
    }


    async function loadStandings() {
      const box =
        document.getElementById(
          "standings"
        );


      box.className =
        "loading";


      box.innerHTML = `
        <div class="loading-icon">
          🏆
        </div>

        KBO 순위를 불러오는 중입니다.
      `;


      try {
        const response =
          await fetch(
            "/api/standings",
            {
              cache:
                "no-store"
            }
          );


        if (!response.ok) {
          throw new Error(
            "HTTP " +
            response.status
          );
        }


        const data =
          await response.json();


        if (!data.success) {
          throw new Error(
            data.error ||
            "API 오류"
          );
        }


        if (
          !Array.isArray(
            data.standings
          ) ||
          data.standings.length === 0
        ) {
          throw new Error(
            "순위 데이터가 비어 있습니다."
          );
        }


        renderStandings(
          data.standings
        );


        renderLotteSummary(
          data.lotte
        );


        setUpdateText(
          data.year
        );
      }

      catch (error) {
        console.error(
          "순위 오류:",
          error
        );


        renderError(
          error?.message ||
          String(error)
        );
      }
    }


    loadStandings();

  </script>

</body>
</html>
