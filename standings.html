<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#07152b"
  >

  <title>KBO 순위 | 윤강 자이언츠</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;

      background: #f3f5f8;
      color: #111827;
    }

    .top {
      background:
        linear-gradient(
          145deg,
          #07152b,
          #102b55
        );

      color: white;

      padding:
        18px
        17px
        28px;
    }

    .top-inner {
      max-width: 700px;
      margin: 0 auto;
    }

    .nav {
      display: flex;
      align-items: center;

      margin-bottom: 30px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 40px;
      height: 40px;

      border-radius: 13px;

      background:
        rgba(
          255,
          255,
          255,
          0.11
        );

      color: white;

      font-size: 21px;
      font-weight: 800;

      text-decoration: none;
    }

    .title-small {
      margin-bottom: 7px;

      color: #9fb3d2;

      font-size: 12px;
      font-weight: 800;
    }

    h1 {
      margin: 0;

      font-size: 31px;

      letter-spacing: -0.045em;
    }

    .description {
      margin:
        10px
        0
        0;

      color: #b7c4d8;

      font-size: 13px;
      line-height: 1.6;
    }

    main {
      width: 100%;
      max-width: 700px;

      margin: 0 auto;

      padding:
        21px
        13px
        60px;
    }

    .info {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin:
        0
        4px
        11px;
    }

    .info strong {
      font-size: 16px;
    }

    .info span {
      color: #8a94a3;

      font-size: 11px;
    }

    .table-card {
      overflow-x: auto;

      background: white;

      border:
        1px solid
        #e5e9ef;

      border-radius: 18px;

      box-shadow:
        0
        5px
        18px
        rgba(
          25,
          35,
          55,
          0.04
        );
    }

    table {
      width: 100%;
      min-width: 620px;

      border-collapse: collapse;
    }

    th {
      padding:
        13px
        8px;

      background: #f8f9fb;

      color: #7b8493;

      border-bottom:
        1px solid
        #e9ecf0;

      font-size: 11px;
      font-weight: 800;

      text-align: center;
    }

    td {
      padding:
        15px
        8px;

      border-bottom:
        1px solid
        #edf0f3;

      font-size: 12px;

      text-align: center;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .rank {
      width: 40px;

      font-size: 14px;
      font-weight: 900;
    }

    .team {
      min-width: 95px;

      font-size: 13px;
      font-weight: 800;

      text-align: left;
    }

    .lotte {
      background: #fff7f8;
    }

    .lotte .rank,
    .lotte .team {
      color: #d71935;
    }

    .loading {
      padding: 45px 20px;

      color: #8a94a3;

      text-align: center;

      font-size: 13px;
    }

    .loading-icon {
      margin-bottom: 10px;

      font-size: 27px;
    }

    .footer {
      margin-top: 20px;

      color: #a0a7b2;

      font-size: 11px;

      text-align: center;
    }
  </style>
</head>

<body>

  <header class="top">

    <div class="top-inner">

      <div class="nav">

        <a
          href="/"
          class="back"
          aria-label="메인으로 돌아가기"
        >
          ‹
        </a>

      </div>

      <div class="title-small">
        YUNGANG GIANTS
      </div>

      <h1>
        KBO 순위
      </h1>

      <p class="description">
        2026 KBO 리그의 구단별 순위를 확인합니다.
      </p>

    </div>

  </header>


  <main>

    <div class="info">

      <strong>
        팀 순위
      </strong>

      <span id="updateText">
        데이터 연결 준비
      </span>

    </div>


    <div class="table-card">

      <div
        class="loading"
        id="standings"
      >

        <div class="loading-icon">
          🏆
        </div>

        순위 데이터 연결 준비 중

      </div>

    </div>


    <div class="footer">
      윤강 자이언츠
    </div>

  </main>

</body>
</html>
