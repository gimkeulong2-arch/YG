<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#07152b"
  >

  <title>롯데 선수단 | 윤강 자이언츠</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;

      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;

      background: #f3f5f8;

      color: #111827;
    }


    .top {
      padding:
        20px
        18px
        30px;

      background:
        linear-gradient(
          145deg,
          #07152b,
          #102b55
        );

      color: white;
    }


    .top-inner,
    .main {
      width: 100%;
      max-width: 650px;

      margin: 0 auto;
    }


    .back {
      display: inline-block;

      margin-bottom: 27px;

      color: #c4d0e2;

      text-decoration: none;

      font-size: 14px;
      font-weight: 700;
    }


    .label {
      margin-bottom: 7px;

      color: #9fb3d2;

      font-size: 12px;
      font-weight: 800;
    }


    h1 {
      margin: 0;

      font-size: 31px;

      letter-spacing: -0.04em;
    }


    .description {
      margin:
        10px
        0
        0;

      color: #b7c4d8;

      font-size: 13px;

      line-height: 1.6;
    }


    .main {
      padding:
        21px
        16px
        60px;
    }


    .summary {
      display: flex;

      align-items: center;
      justify-content: space-between;

      padding: 18px;

      margin-bottom: 25px;

      background: white;

      border:
        1px solid
        #e5e9ef;

      border-radius: 18px;
    }


    .summary strong {
      display: block;

      margin-bottom: 4px;

      font-size: 15px;
    }


    .summary span {
      color: #8a94a3;

      font-size: 12px;
    }


    .count {
      color: #e51b35;

      font-size: 24px;
      font-weight: 900;
    }


    .section {
      margin-bottom: 28px;
    }


    .section-title {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin:
        0
        3px
        11px;
    }


    .section-title h2 {
      margin: 0;

      font-size: 19px;

      letter-spacing: -0.035em;
    }


    .section-title span {
      color: #8a94a3;

      font-size: 12px;
    }


    .staff-grid {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );

      gap: 9px;
    }


    .person {
      position: relative;

      min-height: 82px;

      padding:
        15px
        14px;

      background: white;

      border:
        1px solid
        #e5e9ef;

      border-radius: 16px;
    }


    .person.manager {
      border:
        1px solid
        #e51b35;

      background: #fff8f8;
    }


    .number {
      margin-bottom: 7px;

      color: #e51b35;

      font-size: 12px;
      font-weight: 900;
    }


    .name {
      font-size: 16px;
      font-weight: 900;
    }


    .role {
      margin-top: 4px;

      color: #8a94a3;

      font-size: 11px;
    }


    .position {
      margin-bottom: 21px;
    }


    .position:last-child {
      margin-bottom: 0;
    }


    .position-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin:
        0
        3px
        9px;
    }


    .position-name {
      font-size: 14px;
      font-weight: 900;
    }


    .position-count {
      color: #929baa;

      font-size: 11px;
    }


    .players {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );

      gap: 9px;
    }


    .loading,
    .error {
      padding: 32px 20px;

      background: white;

      border:
        1px solid
        #e5e9ef;

      border-radius: 18px;

      text-align: center;

      color: #7b8493;

      font-size: 13px;

      line-height: 1.7;
    }


    .retry {
      margin-top: 14px;

      padding:
        9px
        14px;

      border: 0;

      border-radius: 10px;

      background: #07152b;

      color: white;

      font-weight: 800;
    }


    .footer {
      padding-top: 8px;

      text-align: center;

      color: #a0a7b2;

      font-size: 11px;
    }


    @media (
      max-width: 360px
    ) {

      .staff-grid,
      .players {
        grid-template-columns:
          1fr;
      }

    }

  </style>

</head>


<body>

  <header class="top">

    <div class="top-inner">

      <a
        class="back"
        href="/"
      >
        ← 윤강 자이언츠
      </a>


      <div class="label">
        LOTTE GIANTS
      </div>


      <h1>
        롯데 선수단
      </h1>


      <p class="description">
        현재 KBO 리그에 등록된
        롯데 자이언츠 1군 선수와
        코칭스태프입니다.
      </p>

    </div>

  </header>


  <main class="main">

    <div
      id="content"
      class="loading"
    >
      KBO 선수단 정보를
      불러오는 중입니다.
    </div>


    <div class="footer">
      KBO 공식 등록 현황 기준
      · 윤강 자이언츠
    </div>

  </main>


  <script>

    function escapeHtml(value) {
      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );
    }


    function personCard(
      person,
      role,
      manager = false
    ) {
      return `
        <div
          class="
            person
            ${manager
              ? "manager"
              : ""}
          "
        >

          <div class="number">
            #${escapeHtml(
              person.number
            )}
          </div>

          <div class="name">
            ${escapeHtml(
              person.name
            )}
          </div>

          <div class="role">
            ${escapeHtml(
              role
            )}
          </div>

        </div>
      `;
    }


    function positionHtml(
      title,
      people
    ) {
      const cards =
        people
          .map(
            person =>
              personCard(
                person,
                title
              )
          )
          .join("");


      return `
        <div class="position">

          <div class="position-header">

            <div class="position-name">
              ${escapeHtml(title)}
            </div>

            <div class="position-count">
              ${people.length}명
            </div>

          </div>


          <div class="players">
            ${cards}
          </div>

        </div>
      `;
    }


    function render(data) {
      const box =
        document.getElementById(
          "content"
        );


      const roster =
        data.roster;


      const managerHtml =
        roster.manager
          .map(
            person =>
              personCard(
                person,
                "감독",
                true
              )
          )
          .join("");


      const coachHtml =
        roster.coaches
          .map(
            person =>
              personCard(
                person,
                "코치"
              )
          )
          .join("");


      box.className = "";


      box.innerHTML = `

        <div class="summary">

          <div>

            <strong>
              롯데 자이언츠 1군
            </strong>

            <span>
              KBO 현재 등록 명단
            </span>

          </div>

          <div class="count">
            ${escapeHtml(
              data.playerCount
            )}명
          </div>

        </div>


        <section class="section">

          <div class="section-title">

            <h2>
              감독
            </h2>

            <span>
              ${roster.manager.length}명
            </span>

          </div>


          <div class="staff-grid">
            ${managerHtml}
          </div>

        </section>


        <section class="section">

          <div class="section-title">

            <h2>
              코치
            </h2>

            <span>
              ${roster.coaches.length}명
            </span>

          </div>


          <div class="staff-grid">
            ${coachHtml}
          </div>

        </section>


        <section class="section">

          <div class="section-title">

            <h2>
              1군 선수
            </h2>

            <span>
              ${escapeHtml(
                data.playerCount
              )}명
            </span>

          </div>


          ${positionHtml(
            "투수",
            roster.pitchers
          )}


          ${positionHtml(
            "포수",
            roster.catchers
          )}


          ${positionHtml(
            "내야수",
            roster.infielders
          )}


          ${positionHtml(
            "외야수",
            roster.outfielders
          )}

        </section>
      `;
    }


    function renderError(message) {
      const box =
        document.getElementById(
          "content"
        );


      box.className =
        "error";


      box.innerHTML = `

        선수단 정보를
        불러오지 못했습니다.

        <br>

        ${escapeHtml(message)}

        <br>

        <button
          class="retry"
          onclick="loadPlayers()"
        >
          다시 시도
        </button>
      `;
    }


    async function loadPlayers() {
      const box =
        document.getElementById(
          "content"
        );


      box.className =
        "loading";


      box.textContent =
        "KBO 선수단 정보를 불러오는 중입니다.";


      try {
        const response =
          await fetch(
            "/api/players",
            {
              cache:
                "no-store"
            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.success
        ) {
          throw new Error(
            data.error ||
            "API 오류"
          );
        }


        render(data);
      }

      catch (error) {
        console.error(
          error
        );


        renderError(
          error?.message ||
          String(error)
        );
      }
    }


    loadPlayers();

  </script>

</body>

</html>
